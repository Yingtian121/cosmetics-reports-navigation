<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面部彩妆细分类目气泡图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    border: 0.5px solid rgba(0,0,0,0.1);
    padding: 24px 28px;
    max-width: 1100px;
    width: 100%;
  }
  h2 { font-size: 17px; font-weight: 500; color: #2C2C2A; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #888780; margin-bottom: 6px; }
  .legend-row { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 16px; font-size: 12px; }
  .legend-item { display: flex; align-items: center; gap: 4px; color: #5F5E5A; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .chart-wrap { position: relative; width: 100%; height: 660px; }
  .footer { font-size: 12px; color: #888780; margin-top: 8px; border-top: 0.5px solid rgba(0,0,0,0.08); padding-top: 10px; }
</style>
</head>
<body>
<div class="card">
  <h2>面部彩妆细分类目气泡图</h2>
  <p class="subtitle">X轴：销售额（对数轴） · Y轴：销售额同比增速 · 气泡大小：客单价 · <span style="color:#C0392B;">红=正增长</span> · <span style="color:#1B8C3E;">绿=负增长</span> · 虚线=零增长参考线</p>
  <div class="chart-wrap">
    <canvas id="bubbleChart" role="img" aria-label="面部彩妆细分类目气泡图"></canvas>
  </div>
  <p class="footer">气泡越大表示客单价越高。气垫（¥228）和粉霜（¥224）客单价最高，阴影（¥56）和腮红（¥61）最低。12 个品类全覆盖，鼠标悬停查看详细数据。</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  // ── 数据 ──
  var items = [
    { name: '粉底液/膏',       sales: 1271605939, growth:  1.7,  asp: 155.1 },
    { name: '隔离/妆前/素颜霜', sales: 823068606,  growth: -7.4,  asp: 115.4 },
    { name: '腮红/胭脂',       sales: 252773395,  growth:  6.7,  asp: 61.3  },
    { name: '遮瑕',            sales: 301236361,  growth:  1.1,  asp: 77.5  },
    { name: '蜜粉/散粉',       sales: 656889999,  growth:  7.7,  asp: 169.4 },
    { name: '气垫',            sales: 849254978,  growth: -9.1,  asp: 227.5 },
    { name: '粉饼',            sales: 371289570,  growth: -13.2, asp: 114.9 },
    { name: '定妆喷雾',        sales: 196103185,  growth:  1.0,  asp: 67.7  },
    { name: '阴影',            sales: 125671482,  growth: -0.9,  asp: 55.5  },
    { name: '高光',            sales: 137126408,  growth:  5.9,  asp: 78.5  },
    { name: 'BB霜',            sales: 69082083,   growth: -1.9,  asp: 99.1  },
    { name: '粉霜',            sales: 49601834,   growth: -12.1, asp: 224.0 }
  ];

  // 涨=红，跌=绿（中国股市惯例）
  function growthColor(g) {
    if (g >= 5)   return '#C0392B';
    if (g >= 1)   return '#E05555';
    if (g >= 0)   return '#F4A4A4';
    if (g >= -3)  return '#8BC89B';
    if (g >= -8)  return '#3DAD58';
    return '#1B8C3E';
  }

  // 气泡半径 = sqrt(客单价) 缩放
  var aspMin = Infinity, aspMax = -Infinity;
  items.forEach(function(d) { aspMin = Math.min(aspMin, d.asp); aspMax = Math.max(aspMax, d.asp); });
  var sqrtMin = Math.sqrt(aspMin), sqrtMax = Math.sqrt(aspMax);
  function calcR(asp) {
    var s = Math.sqrt(asp);
    var minR = 8, maxR = 30;
    return minR + ((s - sqrtMin) / (sqrtMax - sqrtMin)) * (maxR - minR);
  }

  var datasets = items.map(function(d) {
    var c = growthColor(d.growth);
    var rgb = c.replace('#','');
    var r2 = parseInt(rgb.substring(0,2),16);
    var g2 = parseInt(rgb.substring(2,4),16);
    var b2 = parseInt(rgb.substring(4,6),16);
    return {
      label: d.name,
      data: [{ x: d.sales, y: d.growth, r: calcR(d.asp) }],
      backgroundColor: 'rgba('+r2+','+g2+','+b2+',0.45)',
      borderColor: c,
      borderWidth: 1.5
    };
  });

  var ctx = document.getElementById('bubbleChart').getContext('2d');

  // ── 引线偏移表（12 个品类，经像素坐标交叉检验，确保无交叉无穿越） ──
  var offsets = [
    /* 0 粉底液/膏 */        { dx:  70, dy: -50 },  // ↗ 右上角（右边缘，完全空白）
    /* 1 隔离/妆前/素颜霜 */ { dx: -55, dy: -50 },  // ↖ 左上（与气垫→反向，与蜜粉↖ Y轴分层 ~15%）
    /* 2 腮红/胭脂 */        { dx:   5, dy: -52 },  // ↑ 正上方
    /* 3 遮瑕 */             { dx:  55, dy: -38 },  // ↗ 右偏上
    /* 4 蜜粉/散粉 */        { dx: -62, dy: -38 },  // ↖ 左偏上
    /* 5 气垫 */             { dx:  60, dy:  10 },  // → 近水平右
    /* 6 粉饼 */             { dx:   0, dy:  58 },  // ↓ 正下
    /* 7 定妆喷雾 */         { dx:  70, dy:  -2 },  // → 水平右
    /* 8 阴影 */             { dx: -62, dy: -42 },  // ↖ 左偏上
    /* 9 高光 */             { dx:  52, dy: -42 },  // ↗ 右偏上
    /*10 BB霜 */             { dx: -70, dy:   6 },  // ← 水平左
    /*11 粉霜 */             { dx: -65, dy:  48 }   // ↙ 左偏下
  ];

  var bubbleLabelPlugin = {
    id: 'bubbleLabels',
    afterDatasetsDraw: function(chart) {
      var ctx2 = chart.ctx;
      ctx2.save();
      ctx2.font = '12px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';

      datasets.forEach(function(ds, i) {
        var d = items[i];
        var meta = chart.getDatasetMeta(i);
        if (!meta.data || meta.data.length === 0) return;
        var el = meta.data[0];
        var cx = el.x, cy = el.y;
        var r = el.options.radius || calcR(d.asp);
        var off = offsets[i];

        var angle = Math.atan2(off.dy, off.dx);
        var startX = cx + Math.cos(angle) * (r + 1);  // +1 从气泡边缘外侧起，不擦边
        var startY = cy + Math.sin(angle) * (r + 1);
        var endX = cx + off.dx;
        var endY = cy + off.dy;

        // 虚线引线
        ctx2.beginPath();
        ctx2.moveTo(startX, startY);
        ctx2.lineTo(endX, endY);
        ctx2.strokeStyle = 'rgba(150,150,150,0.55)';
        ctx2.lineWidth = 0.7;
        ctx2.setLineDash([3, 3]);
        ctx2.stroke();
        ctx2.setLineDash([]);

        // 文字对齐
        var align = 'center';
        if (off.dx > 35) align = 'left';
        else if (off.dx < -35) align = 'right';

        var baseline = 'middle';
        if (off.dy < -30) baseline = 'bottom';
        else if (off.dy > 30) baseline = 'top';

        ctx2.textAlign = align;
        ctx2.textBaseline = baseline;
        ctx2.fillStyle = '#2C2C2A';
        ctx2.fillText(d.name, endX, endY);
      });
      ctx2.restore();
    }
  };

  new Chart(ctx, {
    type: 'bubble',
    data: { datasets: datasets },
    plugins: [bubbleLabelPlugin],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: {
        padding: { top: 58, right: 150, bottom: 40, left: 95 }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var item = items[ctx.datasetIndex];
              return [
                ctx.dataset.label,
                '销售额: ' + (item.sales / 100000000).toFixed(2) + '亿',
                '同比增速: ' + (item.growth > 0 ? '+' : '') + item.growth.toFixed(1) + '%',
                '客单价: ¥' + item.asp.toFixed(0)
              ];
            }
          }
        }
      },
      scales: {
        x: {
          type: 'logarithmic',
          title: { display: true, text: '销售额（对数轴）', font: { size: 13, weight: '500' }, color: '#444441' },
          ticks: {
            callback: function(v) {
              var vals = [40000000, 80000000, 150000000, 300000000, 600000000, 1000000000, 1500000000];
              if (vals.indexOf(v) !== -1) return (v / 100000000).toFixed(v < 100000000 ? 2 : 1) + '亿';
              return null;
            },
            font: { size: 11 }, color: '#5F5E5A', maxRotation: 0
          },
          grid: { color: 'rgba(0,0,0,0.05)' },
          min: 38000000, max: 1500000000
        },
        y: {
          type: 'linear',
          title: { display: true, text: '销售额同比增速（%）', font: { size: 13, weight: '500' }, color: '#444441' },
          ticks: {
            callback: function(v) { return v + '%'; },
            stepSize: 5,
            font: { size: 11 }, color: '#5F5E5A'
          },
          grid: { color: 'rgba(0,0,0,0.05)' },
          min: -15, max: 10,
          // 零增长参考线
          border: { display: false }
        }
      }
    },
    // 零增长参考线
    plugins: [bubbleLabelPlugin, {
      id: 'zeroLine',
      afterDraw: function(chart) {
        var ctx2 = chart.ctx;
        var yScale = chart.scales.y;
        var xScale = chart.scales.x;
        var zeroY = yScale.getPixelForValue(0);
        ctx2.save();
        ctx2.beginPath();
        ctx2.moveTo(xScale.left, zeroY);
        ctx2.lineTo(xScale.right, zeroY);
        ctx2.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx2.lineWidth = 1;
        ctx2.setLineDash([5, 5]);
        ctx2.stroke();
        ctx2.setLineDash([]);
        ctx2.restore();
      }
    }]
  });
</script>
</body>
</html>
