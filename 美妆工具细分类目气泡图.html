<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美妆工具细分类目气泡图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    border: 0.5px solid rgba(0,0,0,0.1);
    padding: 24px 28px;
    max-width: 960px;
    width: 100%;
  }
  h2 { font-size: 17px; font-weight: 500; color: #2C2C2A; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #888780; margin-bottom: 20px; }
  .chart-wrap { position: relative; width: 100%; height: 540px; }
  .footer { font-size: 12px; color: #888780; margin-top: 14px; border-top: 0.5px solid rgba(0,0,0,0.08); padding-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <h2>美妆工具细分类目销量-销售额气泡图</h2>
  <p class="subtitle">X轴：销量合计 · Y轴：销售额 · 气泡大小：销售额同比增速</p>
  <div class="chart-wrap">
    <canvas id="bubbleChart" role="img" aria-label="美妆工具细分类目气泡图"></canvas>
  </div>
  <p class="footer">气泡大小代表销售额同比增速。化妆刷增速 61% 遥遥领先，化妆/美容工具虽体量最大但增速仅 6%。</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  var items = [
    { name: '化妆/美容工具', x: 21016841, y: 557684241, growth: 6.0,  color: '#534AB7' },
    { name: '化妆刷',       x: 6675373,  y: 212198143, growth: 61.0, color: '#D4537E' },
    { name: '假睫毛',       x: 5938529,  y: 185716895, growth: 38.4, color: '#D85A30' },
    { name: '美妆蛋/扑/海绵', x: 5146054, y: 140066978, growth: 15.9, color: '#185FA5' }
  ];

  function calcR(g) {
    var minR = 12, maxR = 48;
    var minG = 6.0, maxG = 61.0;
    var norm = (Math.sqrt(g) - Math.sqrt(minG)) / (Math.sqrt(maxG) - Math.sqrt(minG));
    return minR + norm * (maxR - minR);
  }

  function hexToRgb(hex) {
    var r = parseInt(hex.slice(1,3),16);
    var g = parseInt(hex.slice(3,5),16);
    var b = parseInt(hex.slice(5,7),16);
    return r+','+g+','+b;
  }

  var datasets = items.map(function(d) {
    return {
      label: d.name,
      data: [{ x: d.x, y: d.y, r: calcR(d.growth) }],
      backgroundColor: 'rgba('+hexToRgb(d.color)+',0.45)',
      borderColor: d.color,
      borderWidth: 1.5
    };
  });

  // 引线偏移表 — 4条引线指向四个不同方向，互不交叉、不穿越气泡
  // 右下集群（化妆刷/假睫毛/美妆蛋）呈放射状散开：化妆刷→右、假睫毛↖左上、美妆蛋↘右下
  // 右上孤立（化妆/美容工具）↗右上空白区
  var offsets = [
    /* 0 化妆/美容工具 r≈12 */ { dx:  65, dy: -25 },  // ↗ 右上（孤立气泡，大片空白）
    /* 1 化妆刷 r≈48 */       { dx:  68, dy:   0 },  // → 正右（远离假睫毛↖和美妆蛋↘）
    /* 2 假睫毛 r≈42 */       { dx: -50, dy: -38 },  // ↖ 左上（与化妆刷→正交，避开美妆蛋↘）
    /* 3 美妆蛋/扑/海绵 r≈24 */ { dx:  45, dy:  48 }   // ↘ 右下（与假睫毛↖反向，远离化妆刷→）
  ];

  var labelPlugin = {
    id: 'bubbleLabels',
    afterDatasetsDraw: function(chart) {
      var ctx2 = chart.ctx;
      ctx2.save();
      ctx2.font = '12px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
      ctx2.textBaseline = 'middle';

      items.forEach(function(d, i) {
        var meta = chart.getDatasetMeta(i);
        if (!meta.data || meta.data.length === 0) return;
        var pt = meta.data[0];
        var cx = pt.x, cy = pt.y;
        var r = datasets[i].data[0].r;
        var off = offsets[i];
        var angle = Math.atan2(off.dy, off.dx);
        var sx = cx + (r + 4) * Math.cos(angle);
        var sy = cy + (r + 4) * Math.sin(angle);
        var endX = cx + off.dx;
        var endY = cy + off.dy;

        // 虚线引线
        ctx2.beginPath();
        ctx2.moveTo(sx, sy);
        ctx2.lineTo(endX, endY);
        ctx2.strokeStyle = '#aaa';
        ctx2.lineWidth = 0.7;
        ctx2.setLineDash([3, 3]);
        ctx2.stroke();
        ctx2.setLineDash([]);

        // 文字对齐
        var align = 'center';
        if (off.dx > 30) align = 'left';
        else if (off.dx < -30) align = 'right';

        var baseline = 'middle';
        if (off.dy < -35) baseline = 'bottom';
        else if (off.dy > 35) baseline = 'top';

        ctx2.textAlign = align;
        ctx2.textBaseline = baseline;
        ctx2.fillStyle = '#2C2C2A';
        ctx2.fillText(d.name, endX, endY);
      });
      ctx2.restore();
    }
  };

  var ctx = document.getElementById('bubbleChart').getContext('2d');
  new Chart(ctx, {
    type: 'bubble',
    data: { datasets: datasets },
    plugins: [labelPlugin],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 35, right: 120, bottom: 35, left: 90 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var item = items[ctx.datasetIndex];
              return [
                ctx.dataset.label,
                '销量: ' + (ctx.raw.x / 10000).toFixed(1) + '万',
                '销售额: ' + (ctx.raw.y / 100000000).toFixed(2) + '亿',
                '同比增速: ' + item.growth.toFixed(1) + '%'
              ];
            }
          }
        }
      },
      scales: {
        x: {
          title: { display: true, text: '销量合计', font: { size: 13, weight: '500' }, color: '#444441' },
          ticks: {
            callback: function(v) { return (v / 10000).toFixed(0) + '万'; },
            font: { size: 11 }, color: '#5F5E5A', maxRotation: 0
          },
          grid: { color: 'rgba(0,0,0,0.06)' },
          min: 0, max: 26000000
        },
        y: {
          title: { display: true, text: '销售额', font: { size: 13, weight: '500' }, color: '#444441' },
          ticks: {
            callback: function(v) { return (v / 100000000).toFixed(2) + '亿'; },
            font: { size: 11 }, color: '#5F5E5A'
          },
          grid: { color: 'rgba(0,0,0,0.06)' },
          min: 0, max: 650000000
        }
      }
    }
  });
</script>
</body>
</html>
