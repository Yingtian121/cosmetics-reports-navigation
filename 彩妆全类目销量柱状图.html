<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩妆全类目销量柱状图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    border: 0.5px solid rgba(0,0,0,0.1);
    padding: 24px 28px;
    max-width: 960px;
    width: 100%;
  }
  h2 { font-size: 17px; font-weight: 500; color: #2C2C2A; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #888780; margin-bottom: 20px; }
  .chart-wrap { position: relative; width: 100%; height: 560px; }
  .footer { font-size: 12px; color: #888780; margin-top: 14px; border-top: 0.5px solid rgba(0,0,0,0.08); padding-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <h2>彩妆全类目销量柱状图</h2>
  <p class="subtitle">按销量从高到低排列 · 单位：万件</p>
  <div class="chart-wrap">
    <canvas id="barChart" role="img" aria-label="彩妆全类目销量柱状图">彩妆全类目销量柱状图</canvas>
  </div>
  <p class="footer">美容工具以 4516 万件居首，面部彩妆 4204 万件紧随其后。身体彩妆仅 1.1 万件，位居末位。</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  var raw = [
    { name: '美容工具',             sales: 1226078248, volume: 45162282 },
    { name: '面部彩妆',             sales: 5106488584, volume: 42036653 },
    { name: '眼部彩妆',             sales: 974427598,  volume: 20149167 },
    { name: '唇部彩妆',             sales: 1414048697, volume: 14948970 },
    { name: '香水/香水用品',        sales: 1319325377, volume: 6752741  },
    { name: '指甲油/美甲产品（新）',sales: 172728211,  volume: 6365445  },
    { name: '美甲工具',             sales: 114281575,  volume: 5057139  },
    { name: '彩妆套装（新）',       sales: 443786263,  volume: 2730629  },
    { name: '旅行装/体验装',        sales: 39727587,   volume: 2495650  },
    { name: '男士彩妆（新）',       sales: 43790049,   volume: 593670   },
    { name: '美甲灯/美甲机',        sales: 8161585,    volume: 234763   },
    { name: '其它彩妆',             sales: 6101096,    volume: 122389   },
    { name: '身体彩妆',             sales: 379287,     volume: 11345    }
  ];

  // Sort by volume descending
  raw.sort(function(a, b) { return b.volume - a.volume; });

  var labels = raw.map(function(d) { return d.name; });
  var data   = raw.map(function(d) { return d.volume / 10000; }); // 万件

  var colors = [
    '#D85A30','#534AB7','#185FA5','#0F6E56','#BA7517',
    '#A32D2D','#3B6D11','#378ADD','#1D9E75','#D4537E',
    '#888780','#7F77DD','#993556'
  ];

  var ctx = document.getElementById('barChart').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: '销量（万件）',
        data: data,
        backgroundColor: colors.map(function(c) {
          var h = c.replace('#','');
          var r = parseInt(h.slice(0,2),16);
          var g = parseInt(h.slice(2,4),16);
          var b = parseInt(h.slice(4,6),16);
          return 'rgba('+r+','+g+','+b+',0.75)';
        }),
        borderColor: colors,
        borderWidth: 1,
        borderRadius: 4,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'y',
      layout: {
        padding: { top: 10, right: 40, bottom: 10, left: 10 }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var item = raw[ctx.dataIndex];
              return [
                '销量: ' + ctx.raw.toFixed(0) + '万件',
                '销售额: ' + (item.sales / 100000000).toFixed(2) + '亿'
              ];
            }
          }
        }
      },
      scales: {
        x: {
          title: { display: true, text: '销量（万件）', font: { size: 13, weight: '500' }, color: '#444441' },
          ticks: {
            callback: function(v) { return v.toFixed(0) + '万'; },
            font: { size: 11 }, color: '#5F5E5A'
          },
          grid: { color: 'rgba(0,0,0,0.05)' }
        },
        y: {
          ticks: {
            font: { size: 12 }, color: '#2C2C2A'
          },
          grid: { display: false }
        }
      }
    }
  });
</script>
</body>
</html>
