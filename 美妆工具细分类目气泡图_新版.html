<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美妆工具细分类目气泡图</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .card {
    background: #fff; border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    padding: 28px 32px 20px; max-width: 1060px; width: 100%;
  }
  .title { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #999; margin-bottom: 18px; }
  .chart-wrap { position: relative; width: 100%; height: 600px; }
  .footer { text-align: center; color: #aaa; font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="title">美妆工具细分类目 — 销售额 × 增速气泡图</div>
  <div class="subtitle">横轴：销售额（对数） · 纵轴：同比增速（平方根压缩） · 气泡：客单价 · 涨=红 / 跌=绿</div>
  <div class="chart-wrap"><canvas id="bubbleChart"></canvas></div>
  <p class="footer">清洗剂/清洗液增速断层第一（362.7%），清洁器次之（203.1%）；化妆/美容工具体量最大但跌15.8%；假睫毛工具跌幅最深（-36.1%）</p>
</div>
<script>
(function() {
  var ctx = document.getElementById('bubbleChart').getContext('2d');

  // ── 数据：销售额(元)、增速(%)、客单价(元) ──
  var items = [
    { name: '化妆/美容工具',          sales: 442830642, growth: -15.8, asp: 26.63 },
    { name: '化妆刷',                 sales: 164394578, growth:  24.7, asp: 32.00 },
    { name: '假睫毛',                 sales: 139006694, growth:   3.6, asp: 31.01 },
    { name: '美妆蛋/扑/海绵',         sales: 111559912, growth:  -7.7, asp: 27.52 },
    { name: '双眼皮贴',               sales:  32485460, growth:  22.7, asp: 23.57 },
    { name: '修眉刀',                 sales:  14042416, growth:  -0.3, asp: 11.84 },
    { name: '睫毛夹',                 sales:  15579085, growth:  18.9, asp: 24.56 },
    { name: '化妆棉/湿敷棉',          sales:  10412501, growth: -16.2, asp: 19.31 },
    { name: '假睫毛工具',             sales:  10904044, growth: -36.1, asp: 28.60 },
    { name: '面膜纸',                 sales:   6995872, growth:  -2.1, asp: 17.96 },
    { name: '双眼皮胶水',             sales:   7705645, growth:   3.0, asp: 25.03 },
    { name: '化妆刷清洁器/盒/碗',     sales:    918767, growth: 203.1, asp: 14.30 },
    { name: '美妆工具清洗剂/清洗液',  sales:   1934289, growth: 362.7, asp: 29.51 }
  ];

  // ── 平方根压缩增速（避免极端值碾压其它品类）──
  function sqrtGrowth(g) {
    return g >= 0 ? Math.sqrt(g) : -Math.sqrt(-g);
  }

  // ── 增速 → 颜色（红涨绿跌）──
  function growthColor(g) {
    if (g > 50)  return 'rgba(201,42,42,0.58)';
    if (g > 10)  return 'rgba(215,90,65,0.55)';
    if (g > 0)   return 'rgba(225,120,80,0.50)';
    if (g > -5)  return 'rgba(130,180,130,0.50)';
    if (g > -15) return 'rgba(80,150,80,0.55)';
    return 'rgba(40,110,40,0.58)';
  }
  function borderColor(g) {
    if (g > 50)  return '#C92A2A';
    if (g > 10)  return '#D75A41';
    if (g > 0)   return '#E17850';
    if (g > -5)  return '#60A060';
    if (g > -15) return '#509650';
    return '#288D28';
  }

  // ── 客单价 → 气泡半径 ──
  var asps = items.map(function(d) { return d.asp; });
  var aspMin = Math.min.apply(null, asps);
  var aspMax = Math.max.apply(null, asps);
  function aspToRadius(asp) {
    return 11 + (asp - aspMin) / (aspMax - aspMin) * 24;
  }

  var datasets = items.map(function(d, i) {
    return {
      label: d.name,
      data: [{ x: d.sales, y: sqrtGrowth(d.growth), r: aspToRadius(d.asp) }],
      backgroundColor: growthColor(d.growth),
      borderColor: borderColor(d.growth),
      borderWidth: 1.5,
      pointHoverRadius: aspToRadius(d.asp) + 3
    };
  });

  // ── 引线偏移（13 个品类，方向不交叉不穿过气泡）──
  var offsets = [
    /*  0 化妆/美容工具  */ { dx:  55, dy:   0 },
    /*  1 化妆刷        */ { dx:  50, dy: -25 },
    /*  2 假睫毛        */ { dx:  50, dy: -10 },
    /*  3 美妆蛋        */ { dx:  50, dy:  30 },
    /*  4 双眼皮贴      */ { dx:  50, dy: -25 },
    /*  5 修眉刀        */ { dx:  50, dy: -10 },
    /*  6 睫毛夹        */ { dx:   0, dy: -35 },
    /*  7 化妆棉        */ { dx:  45, dy: -30 },
    /*  8 假睫毛工具    */ { dx: -55, dy:   3 },
    /*  9 面膜纸        */ { dx: -50, dy:  30 },
    /* 10 双眼皮胶水    */ { dx: -45, dy: -15 },
    /* 11 清洁器        */ { dx:  50, dy:  -5 },
    /* 12 清洗剂        */ { dx:  50, dy:  -5 }
  ];

  var chart = new Chart(ctx, {
    type: 'bubble',
    data: { datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 50, right: 150, bottom: 40, left: 140 } },
      scales: {
        x: {
          type: 'logarithmic',
          title: { display: true, text: '销售额（元）', font: { size: 13 }, color: '#666' },
          min: 500000,
          max: 600000000,
          ticks: {
            callback: function(v) {
              if (v >= 1e8) return (v / 1e8).toFixed(1) + '亿';
              if (v >= 1e4) return (v / 1e4).toFixed(0) + '万';
              return v;
            },
            font: { size: 11 },
            color: '#666'
          },
          grid: { color: '#eee' }
        },
        y: {
          title: { display: true, text: '销售额同比增速（%，平方根刻度）', font: { size: 12 }, color: '#666' },
          min: -8,
          max: 22,
          ticks: {
            stepSize: 3,
            callback: function(v) {
              var g = v >= 0 ? (v * v) : -(v * v);
              return Math.round(g) + '%';
            },
            font: { size: 11 },
            color: '#666'
          },
          grid: {
            color: function(ctx) { return ctx.tick.value === 0 ? '#ccc' : '#eee'; },
            lineWidth: function(ctx) { return ctx.tick.value === 0 ? 1.5 : 0.5; }
          }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var d = items[ctx.datasetIndex];
              return [
                d.name,
                '销售额: ' + (d.sales / 1e8).toFixed(2) + '亿',
                '增速: ' + d.growth + '%',
                '客单价: ¥' + d.asp.toFixed(0)
              ];
            }
          }
        }
      }
    },
    plugins: [{
      id: 'labels',
      afterDraw: function(chart) {
        var ctx2 = chart.ctx;
        var metas = [];
        for (var i = 0; i < items.length; i++) {
          metas.push(chart.getDatasetMeta(i));
        }

        ctx2.save();
        ctx2.font = 'bold 12px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';

        for (var i = 0; i < items.length; i++) {
          var d = items[i];
          var pt = metas[i].data[0];
          var cx = pt.x, cy = pt.y;
          var r = aspToRadius(d.asp);
          var off = offsets[i];

          // 引线起点 = 气泡边缘
          var angle = Math.atan2(off.dy, off.dx);
          var sx = cx + Math.cos(angle) * r;
          var sy = cy + Math.sin(angle) * r;

          // 引线终点
          var ex = sx + off.dx;
          var ey = sy + off.dy;

          // 虚线引线
          ctx2.beginPath();
          ctx2.setLineDash([3, 3]);
          ctx2.strokeStyle = '#999';
          ctx2.lineWidth = 0.8;
          ctx2.moveTo(sx, sy);
          ctx2.lineTo(ex, ey);
          ctx2.stroke();
          ctx2.setLineDash([]);

          // 文字对齐
          var align = 'left';
          if (off.dx < -20) align = 'right';
          else if (off.dx <= 20) align = 'center';

          var baseline = 'middle';
          if (off.dy < -20) baseline = 'bottom';
          else if (off.dy > 20) baseline = 'top';

          ctx2.textAlign = align;
          ctx2.textBaseline = baseline;
          ctx2.fillStyle = '#2C2C2A';

          var tx = ex;
          var ty = ey;

          if (off.dx > 0) tx += 4;
          else if (off.dx < 0) tx -= 4;

          ctx2.fillText(d.name, tx, ty);
        }

        ctx2.restore();
      }
    }]
  });
})();
</script>
</body>
</html>
