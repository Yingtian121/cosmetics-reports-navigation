<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唇部彩妆细分类目气泡图</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .card {
    background: #fff; border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    padding: 28px 32px 20px; max-width: 960px; width: 100%;
  }
  .title { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #999; margin-bottom: 18px; }
  .chart-wrap { position: relative; width: 100%; height: 520px; }
  .footer { text-align: center; color: #aaa; font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="title">唇部彩妆细分类目 — 销售额 × 增速气泡图</div>
  <div class="subtitle">横轴：销售额（对数） · 纵轴：同比增速 · 气泡：客单价 · ⚫涨=红 / 跌=绿</div>
  <div class="chart-wrap"><canvas id="bubbleChart"></canvas></div>
  <p class="footer">唇膏/口红客单价最高（¥148），唇笔/唇线笔增速断层领先（140.5%），唇彩/唇蜜类跌幅最大（-16.3%）</p>
</div>
<script>
(function() {
  var ctx = document.getElementById('bubbleChart').getContext('2d');

  // ── 数据：销售额(元)、增速(%)、客单价(元) ──
  var items = [
    { name: '唇彩/唇蜜/唇釉/唇泥/唇霜', sales: 663707805, growth: -16.29, asp: 71.3 },
    { name: '唇膏/口红',                 sales: 722405117, growth:  -2.64, asp: 147.8 },
    { name: '唇笔/唇线笔',               sales:  27935775, growth: 140.46, asp: 37.2 }
  ];

  // ── 增速 → 颜色（红涨绿跌）──
  function growthColor(g) {
    if (g > 5)  return 'rgba(201,42,42,0.65)';
    if (g > 0)  return 'rgba(215,90,65,0.60)';
    if (g > -5) return 'rgba(80,150,80,0.55)';
    if (g > -10)return 'rgba(55,120,55,0.58)';
    return 'rgba(30,90,30,0.60)';
  }
  function borderColor(g) {
    if (g > 5)  return '#C92A2A';
    if (g > 0)  return '#D75A41';
    if (g > -5) return '#509650';
    if (g > -10)return '#378D37';
    return '#1E5A1E';
  }

  // ── 客单价 → 气泡半径 ──
  var asps = items.map(function(d) { return d.asp; });
  var aspMin = Math.min.apply(null, asps);
  var aspMax = Math.max.apply(null, asps);
  function aspToRadius(asp) {
    return 12 + (asp - aspMin) / (aspMax - aspMin) * 28;
  }

  var datasets = items.map(function(d, i) {
    return {
      label: d.name,
      data: [{ x: d.sales, y: d.growth, r: aspToRadius(d.asp) }],
      backgroundColor: growthColor(d.growth),
      borderColor: borderColor(d.growth),
      borderWidth: 1.5,
      pointHoverRadius: aspToRadius(d.asp) + 3
    };
  });

  // ── 引线偏移（3 个品类方向各异） ──
  var offsets = [
    /* 0 唇彩/唇蜜等 */ { dx: -60, dy: -45 },
    /* 1 唇膏/口红 */   { dx:  50, dy: -35 },
    /* 2 唇笔/唇线笔 */ { dx:  48, dy:  30 }
  ];

  var chart = new Chart(ctx, {
    type: 'bubble',
    data: { datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 50, right: 120, bottom: 30, left: 110 } },
      scales: {
        x: {
          type: 'logarithmic',
          title: { display: true, text: '销售额（元）', font: { size: 13 }, color: '#666' },
          min: 20000000,
          max: 1000000000,
          ticks: {
            callback: function(v) {
              if (v >= 1e8) return (v / 1e8).toFixed(0) + '亿';
              if (v >= 1e4) return (v / 1e4).toFixed(0) + '万';
              return v;
            },
            font: { size: 11 },
            color: '#666'
          },
          grid: { color: '#eee' }
        },
        y: {
          title: { display: true, text: '销售额同比增速（%）', font: { size: 13 }, color: '#666' },
          min: -25,
          max: 160,
          ticks: {
            stepSize: 20,
            callback: function(v) { return v + '%'; },
            font: { size: 11 },
            color: '#666'
          },
          grid: {
            color: function(ctx) { return ctx.tick.value === 0 ? '#ccc' : '#eee'; },
            lineWidth: function(ctx) { return ctx.tick.value === 0 ? 1.5 : 0.5; }
          }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var d = items[ctx.datasetIndex];
              return [
                d.name,
                '销售额: ' + (d.sales / 1e8).toFixed(2) + '亿',
                '增速: ' + d.growth + '%',
                '客单价: ¥' + d.asp.toFixed(0)
              ];
            }
          }
        }
      }
    },
    plugins: [{
      id: 'labels',
      afterDraw: function(chart) {
        var ctx2 = chart.ctx;
        var meta0 = chart.getDatasetMeta(0);
        var meta1 = chart.getDatasetMeta(1);
        var meta2 = chart.getDatasetMeta(2);
        var metas = [meta0, meta1, meta2];

        ctx2.save();
        ctx2.font = 'bold 12px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';

        for (var i = 0; i < items.length; i++) {
          var d = items[i];
          var pt = metas[i].data[0];
          var cx = pt.x, cy = pt.y;
          var r = aspToRadius(d.asp);
          var off = offsets[i];

          // 引线起点 = 气泡边缘
          var angle = Math.atan2(off.dy, off.dx);
          var sx = cx + Math.cos(angle) * r;
          var sy = cy + Math.sin(angle) * r;

          // 引线终点
          var ex = sx + off.dx;
          var ey = sy + off.dy;

          // 虚线引线
          ctx2.beginPath();
          ctx2.setLineDash([3, 3]);
          ctx2.strokeStyle = '#999';
          ctx2.lineWidth = 0.8;
          ctx2.moveTo(sx, sy);
          ctx2.lineTo(ex, ey);
          ctx2.stroke();
          ctx2.setLineDash([]);

          // 文字对齐
          var align = 'left';
          if (off.dx < -20) align = 'right';
          else if (off.dx <= 20) align = 'center';

          var baseline = 'middle';
          if (off.dy < -20) baseline = 'bottom';
          else if (off.dy > 20) baseline = 'top';

          ctx2.textAlign = align;
          ctx2.textBaseline = baseline;
          ctx2.fillStyle = '#2C2C2A';

          var tx = ex;
          var ty = ey;

          // 微调：如果文字紧贴引线末端偏移一点
          if (off.dx > 0) tx += 4;
          else if (off.dx < 0) tx -= 4;

          ctx2.fillText(d.name, tx, ty);
        }

        ctx2.restore();
      }
    }]
  });
})();
</script>
</body>
</html>
