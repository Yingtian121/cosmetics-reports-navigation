<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>眼部彩妆细分类目气泡图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    border: 0.5px solid rgba(0,0,0,0.1);
    padding: 24px 28px;
    max-width: 960px;
    width: 100%;
  }
  h2 { font-size: 17px; font-weight: 500; color: #2C2C2A; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #888780; margin-bottom: 20px; }
  .chart-wrap { position: relative; width: 100%; height: 560px; }
  .footer { font-size: 12px; color: #888780; margin-top: 8px; border-top: 0.5px solid rgba(0,0,0,0.08); padding-top: 10px; }
</style>
</head>
<body>
<div class="card">
  <h2>眼部彩妆细分类目销量-销售额气泡图</h2>
  <p class="subtitle">X轴：销量合计 · Y轴：销售额 · 气泡大小：销售额同比增速</p>
  <div class="chart-wrap">
    <canvas id="bubbleChart" role="img" aria-label="眼部彩妆细分类目气泡图"></canvas>
  </div>
  <p class="footer">气泡大小代表销售额同比增速。卧蚕笔体量最小但增速最高（34%），眼影销售额最大但增速也最高。</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  var items = [
    { name: '眉笔/眉粉/眉膏',  x: 7914134,  y: 264494833, growth: 24.1 },
    { name: '眼线',           x: 4761034,  y: 151598461, growth: 24.2 },
    { name: '睫毛膏',         x: 3494629,  y: 179839197, growth: 13.8 },
    { name: '眼影',           x: 3489252,  y: 360380040, growth: 33.5 },
    { name: '卧蚕笔',         x: 490118,   y: 18115068,  growth: 34.0 }
  ];

  var palette = ['#534AB7', '#D85A30', '#0F6E56', '#D4537E', '#185FA5'];

  var minG = 13.8, maxG = 34.0;
  function calcR(g) {
    var minR = 10, maxR = 32;
    if (maxG === minG) return (minR + maxR) / 2;
    return minR + (g - minG) / (maxG - minG) * (maxR - minR);
  }

  var datasets = items.map(function(d, i) {
    var c = palette[i];
    var rgb = c.replace('#','');
    var r2 = parseInt(rgb.substring(0,2),16);
    var g2 = parseInt(rgb.substring(2,4),16);
    var b2 = parseInt(rgb.substring(4,6),16);
    return {
      label: d.name,
      data: [{ x: d.x, y: d.y, r: calcR(d.growth) }],
      backgroundColor: 'rgba('+r2+','+g2+','+b2+',0.45)',
      borderColor: c,
      borderWidth: 1.5
    };
  });

  // ── 引线偏移表（5个品类，方向各异，无交叉无穿越） ──
  var offsets = [
    /* 0 眉笔/眉粉/眉膏 r≈21 */ { dx:  78, dy: -30 },  // ↗ 右上角，最高最右指向空白角落
    /* 1 眼线 r≈21 */          { dx:  72, dy:  25 },  // ↘ 右下，避开眉笔↗
    /* 2 睫毛膏 r≈10 */        { dx: -62, dy:  18 },  // ↙ 左下，小气泡走左路
    /* 3 眼影 r≈32 */          { dx: -72, dy: -42 },  // ↖ 左上，大气泡指向顶部空白
    /* 4 卧蚕笔 r≈32 */        { dx:  48, dy:  48 }   // ↘ 右下角，指向前方空白区
  ];

  var ctx = document.getElementById('bubbleChart').getContext('2d');

  var bubbleLabelPlugin = {
    id: 'bubbleLabels',
    afterDatasetsDraw: function(chart) {
      var ctx2 = chart.ctx;
      ctx2.save();
      ctx2.font = '12px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';

      datasets.forEach(function(ds, i) {
        var d = items[i];
        var meta = chart.getDatasetMeta(i);
        if (!meta.data || meta.data.length === 0) return;
        var el = meta.data[0];
        var cx = el.x, cy = el.y;
        var r = el.options.radius || calcR(d.growth);
        var off = offsets[i];

        var angle = Math.atan2(off.dy, off.dx);
        var startX = cx + Math.cos(angle) * r;
        var startY = cy + Math.sin(angle) * r;
        var endX = cx + off.dx;
        var endY = cy + off.dy;

        // 虚线引线
        ctx2.beginPath();
        ctx2.moveTo(startX, startY);
        ctx2.lineTo(endX, endY);
        ctx2.strokeStyle = 'rgba(150,150,150,0.65)';
        ctx2.lineWidth = 0.7;
        ctx2.setLineDash([3, 3]);
        ctx2.stroke();
        ctx2.setLineDash([]);

        var align = 'center';
        if (off.dx > 40) align = 'left';
        else if (off.dx < -40) align = 'right';

        var baseline = 'middle';
        if (off.dy < -35) baseline = 'bottom';
        else if (off.dy > 35) baseline = 'top';

        ctx2.textAlign = align;
        ctx2.textBaseline = baseline;
        ctx2.fillStyle = '#2C2C2A';
        ctx2.fillText(d.name, endX, endY);
      });
      ctx2.restore();
    }
  };

  new Chart(ctx, {
    type: 'bubble',
    data: { datasets: datasets },
    plugins: [bubbleLabelPlugin],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: {
        padding: { top: 50, right: 150, bottom: 45, left: 85 }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var item = items[ctx.datasetIndex];
              return [
                ctx.dataset.label,
                '销量: ' + (ctx.raw.x / 10000).toFixed(1) + '万',
                '销售额: ' + (ctx.raw.y / 100000000).toFixed(2) + '亿',
                '同比增速: ' + item.growth.toFixed(1) + '%'
              ];
            }
          }
        }
      },
      scales: {
        x: {
          type: 'logarithmic',
          title: { display: true, text: '销量合计（对数轴）', font: { size: 13, weight: '500' }, color: '#444441' },
          ticks: {
            callback: function(v) {
              var vals = [300000, 500000, 1000000, 2000000, 4000000, 8000000];
              if (vals.indexOf(v) !== -1) return (v / 10000).toFixed(0) + '万';
              return null;
            },
            font: { size: 11 }, color: '#5F5E5A', maxRotation: 0
          },
          grid: { color: 'rgba(0,0,0,0.05)' },
          min: 300000, max: 10000000
        },
        y: {
          type: 'logarithmic',
          title: { display: true, text: '销售额（对数轴）', font: { size: 13, weight: '500' }, color: '#444441' },
          ticks: {
            callback: function(v) {
              var vals = [10000000, 30000000, 60000000, 120000000, 250000000, 500000000];
              if (vals.indexOf(v) !== -1) return (v / 100000000).toFixed(v >= 100000000 ? 1 : 2) + '亿';
              return null;
            },
            font: { size: 11 }, color: '#5F5E5A'
          },
          grid: { color: 'rgba(0,0,0,0.05)' },
          min: 8000000, max: 500000000
        }
      }
    }
  });
</script>
</body>
</html>
