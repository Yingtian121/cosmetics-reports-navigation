<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩妆全类目气泡图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    border: 0.5px solid rgba(0,0,0,0.1);
    padding: 24px 28px;
    max-width: 1020px;
    width: 100%;
  }
  h2 { font-size: 17px; font-weight: 500; color: #2C2C2A; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #888780; margin-bottom: 20px; }
  .chart-wrap { position: relative; width: 100%; height: 660px; }
  .legend {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px 16px;
    margin-top: 16px;
    font-size: 12px;
    color: #5F5E5A;
  }
  .legend span { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .footer { font-size: 12px; color: #888780; margin-top: 14px; border-top: 0.5px solid rgba(0,0,0,0.08); padding-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <h2>彩妆全类目销量-销售额气泡图</h2>
  <p class="subtitle">X轴：销量合计（对数） · Y轴：销售额合计（对数） · 气泡大小：客单价（销售额÷销量）</p>
  <div class="chart-wrap">
    <canvas id="bubbleChart" role="img" aria-label="彩妆全类目气泡图：X轴为销量，Y轴为销售额，气泡大小代表客单价">彩妆全类目气泡图</canvas>
  </div>
  <div class="legend" id="legend"></div>
  <p class="footer">数据说明：气泡大小代表客单价，越高表示品类单价越高。香水客单价最高（195元），旅行装/体验装最低（16元）。</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  var items = [
    { name: '美容工具',             x: 45162282, y: 1226078248 },
    { name: '面部彩妆',             x: 42036653, y: 5106488584 },
    { name: '眼部彩妆',             x: 20149167, y: 974427598  },
    { name: '唇部彩妆',             x: 14948970, y: 1414048697 },
    { name: '香水/香水用品',        x: 6752741,  y: 1319325377 },
    { name: '指甲油/美甲产品（新）',x: 6365445,  y: 172728211  },
    { name: '美甲工具',             x: 5057139,  y: 114281575  },
    { name: '彩妆套装（新）',       x: 2730629,  y: 443786263  },
    { name: '旅行装/体验装',        x: 2495650,  y: 39727587   },
    { name: '男士彩妆（新）',       x: 593670,   y: 43790049   },
    { name: '美甲灯/美甲机',        x: 234763,   y: 8161585    },
    { name: '其它彩妆',             x: 122389,   y: 6101096    },
    { name: '身体彩妆',             x: 11345,    y: 379287     }
  ];

  var palette = [
    '#534AB7','#D4537E','#D85A30','#185FA5','#0F6E56',
    '#BA7517','#A32D2D','#3B6D11','#888780','#378ADD',
    '#1D9E75','#7F77DD','#993556'
  ];

  var prices = items.map(function(d) { return d.y / d.x; });
  var minP = Math.min.apply(null, prices);
  var maxP = Math.max.apply(null, prices);

  function calcR(price) {
    var minR = 12, maxR = 42;
    return minR + (price - minP) / (maxP - minP) * (maxR - minR);
  }

  function hexToRgb(hex) {
    var r = parseInt(hex.slice(1,3),16);
    var g = parseInt(hex.slice(3,5),16);
    var b = parseInt(hex.slice(5,7),16);
    return r+','+g+','+b;
  }

  var datasets = items.map(function(d, i) {
    var price = d.y / d.x;
    return {
      label: d.name,
      data: [{ x: d.x, y: d.y, r: calcR(price) }],
      backgroundColor: 'rgba('+hexToRgb(palette[i])+',0.45)',
      borderColor: palette[i],
      borderWidth: 1.5
    };
  });

  var labelOffsets = [
    { dx:  50, dy: -15 },  // 0 美容工具 → 右上
    { dx:  55, dy:  10 },  // 1 面部彩妆 → 右
    { dx:  45, dy:   0 },  // 2 眼部彩妆 → 右
    { dx:  50, dy: -10 },  // 3 唇部彩妆 → 右
    { dx: -65, dy: -10 },  // 4 香水 → 左
    { dx:  50, dy:   5 },  // 5 指甲油 → 右
    { dx:  45, dy:  12 },  // 6 美甲工具 → 右
    { dx: -65, dy:   5 },  // 7 彩妆套装 → 左
    { dx:  45, dy:  10 },  // 8 旅行装 → 右
    { dx: -60, dy:  -8 },  // 9 男士彩妆 → 左
    { dx:  40, dy:   8 },  // 10 美甲灯 → 右
    { dx: -50, dy:   5 },  // 11 其它彩妆 → 左
    { dx: -55, dy: -10 },  // 12 身体彩妆 → 左下
  ];

  var anchorCache = [];

  function placeLabel(idx, cx, cy, r) {
    var off = labelOffsets[idx];
    var ax = cx + off.dx;
    var ay = cy + off.dy;
    var angle = Math.atan2(off.dy, off.dx);
    var edgeX = cx + (r + 4) * Math.cos(angle);
    var edgeY = cy + (r + 4) * Math.sin(angle);
    return { idx: idx, ax: ax, ay: ay, edgeX: edgeX, edgeY: edgeY, dirH: off.dx > 0 ? 'left' : 'right' };
  }

  var labelPlugin = {
    id: 'bubbleLabels',
    afterDatasetsDraw: function(chart) {
      var ctx = chart.ctx;
      var labels = [];

      items.forEach(function(item, i) {
        var meta = chart.getDatasetMeta(i);
        var pt = meta.data[0];
        if (!pt) return;
        var cx = pt.x;
        var cy = pt.y;
        var r = datasets[i].data[0].r;
        var info = placeLabel(i, cx, cy, r);
        labels.push(info);
      });

      labels.forEach(function(lab) {
        var item = items[lab.idx];
        var color = palette[lab.idx];
        var price = prices[lab.idx];

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(lab.edgeX, lab.edgeY);
        ctx.lineTo(lab.ax, lab.ay);
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 0.5;
        ctx.setLineDash([3, 2]);
        ctx.stroke();
        ctx.setLineDash([]);

        var text = item.name;
        var textX = lab.ax + (lab.dirH === 'left' ? 4 : -4);
        var textY = lab.ay + 4;

        ctx.font = '11px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#2C2C2A';
        ctx.textBaseline = 'middle';
        ctx.textAlign = lab.dirH;
        ctx.fillText(text, textX, textY);

        ctx.restore();
      });
    }
  };

  var ctx = document.getElementById('bubbleChart').getContext('2d');
  new Chart(ctx, {
    type: 'bubble',
    data: { datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: {
        padding: { top: 50, right: 110, bottom: 25, left: 90 }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var item = items[ctx.datasetIndex];
              var price = (item.y / item.x).toFixed(1);
              return [
                ctx.dataset.label,
                '销量: ' + (ctx.raw.x / 10000).toFixed(1) + '万',
                '销售额: ' + (ctx.raw.y / 100000000).toFixed(2) + '亿',
                '客单价: ¥' + price
              ];
            }
          }
        }
      },
      scales: {
        x: {
          type: 'logarithmic',
          title: { display: true, text: '销量合计（对数轴）', font: { size: 13, weight: '500' }, color: '#444441' },
          ticks: {
            callback: function(v) {
              var vals = [10000, 100000, 500000, 2000000, 10000000, 30000000, 50000000];
              if (vals.indexOf(v) !== -1) return (v / 10000).toFixed(0) + '万';
              return null;
            },
            font: { size: 11 }, color: '#5F5E5A', maxRotation: 0
          },
          grid: { color: 'rgba(0,0,0,0.05)' },
          min: 8000, max: 60000000
        },
        y: {
          type: 'logarithmic',
          title: { display: true, text: '销售额合计（对数轴）', font: { size: 13, weight: '500' }, color: '#444441' },
          ticks: {
            callback: function(v) {
              var vals = [200000, 2000000, 20000000, 200000000, 1000000000, 6000000000, 12000000000];
              if (vals.indexOf(v) !== -1) return (v / 100000000).toFixed(v >= 100000000 ? 1 : 2) + '亿';
              return null;
            },
            font: { size: 11 }, color: '#5F5E5A'
          },
          grid: { color: 'rgba(0,0,0,0.05)' },
          min: 200000, max: 12000000000
        }
      }
    },
    plugins: [labelPlugin]
  });

  var legendEl = document.getElementById('legend');
  items.forEach(function(d, i) {
    var price = (d.y / d.x).toFixed(0);
    var span = document.createElement('span');
    span.innerHTML = '<span class="legend-dot" style="background:' + palette[i] + ';"></span>'
      + d.name + ' ¥' + price;
    legendEl.appendChild(span);
  });
</script>
</body>
</html>
